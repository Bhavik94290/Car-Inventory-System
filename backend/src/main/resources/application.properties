spring.application.name=AI_Kata_Car_Dealership_Inventory_System
server.port=8080

# Load backend/.env if present (KEY=VALUE, same names as below) so secrets
# don't need to be passed as shell env vars on every run. Never committed —
# see .gitignore. Copy .env.example to .env and fill in real values.
spring.config.import=optional:file:.env[.properties]

# ---------- MySQL ----------
# Create the DB first:  CREATE DATABASE dealership_db;
spring.datasource.url=jdbc:mysql://localhost:3306/dealership_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Set a long random Base64 secret via environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:change-me-to-a-64+char-random-base64-secret-change-me-please-000}
app.jwt.expiration-ms=86400000

# ---------- Razorpay ----------
# Get test keys from https://dashboard.razorpay.com/app/keys and set them as
# environment variables RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET (never commit real keys).
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:changeme_test_secret}

# ---------- Claude (chatbot assistant) ----------
# Get an API key from https://console.anthropic.com/settings/keys and set it as
# the ANTHROPIC_API_KEY environment variable (never commit real keys).
anthropic.api-key=${ANTHROPIC_API_KEY:changeme}

# ---------- Vehicle image uploads ----------
app.upload-dir=${UPLOAD_DIR:uploads/vehicles}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
