spring.application.name=AI_Kata_Car_Dealership_Inventory_System
server.port=8080

# ---------- MySQL ----------
# Create the DB first:  CREATE DATABASE dealership_db;
spring.datasource.url=jdbc:mysql://localhost:3306/dealership_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password_here}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Set a long random Base64 secret via environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:change-me-to-a-64+char-random-base64-secret-change-me-please-000}
app.jwt.expiration-ms=86400000
