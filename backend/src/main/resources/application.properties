spring.application.name=AI_Kata_Car_Dealership_Inventory_System
# Render (and most PaaS hosts) assign the port to listen on via $PORT.
server.port=${PORT:8080}

# Load backend/.env if present (KEY=VALUE, same names as below) so secrets
# don't need to be passed as shell env vars on every run. Never committed —
# see .gitignore. Copy .env.example to .env and fill in real values.
spring.config.import=optional:file:.env[.properties]

# ---------- MySQL ----------
# Locally this defaults to a DB on localhost (create it first: CREATE DATABASE
# dealership_db;). In production, set DB_URL to the full JDBC URL of your
# hosted MySQL instance (Render doesn't offer managed MySQL itself — see
# README > Deployment for third-party options).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dealership_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Set a long random Base64 secret via environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:change-me-to-a-64+char-random-base64-secret-change-me-please-000}
app.jwt.expiration-ms=86400000

# ---------- Razorpay ----------
# Get test keys from https://dashboard.razorpay.com/app/keys and set them as
# environment variables RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET (never commit real keys).
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:changeme_test_secret}

# ---------- Claude (chatbot assistant) ----------
# Get an API key from https://console.anthropic.com/settings/keys and set it as
# the ANTHROPIC_API_KEY environment variable (never commit real keys).
anthropic.api-key=${ANTHROPIC_API_KEY:changeme}

# ---------- Email (password reset OTP) ----------
# Gmail SMTP with a Google App Password (not your normal password):
# https://myaccount.google.com/apppasswords — requires 2-Step Verification enabled.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ---------- CORS ----------
# Comma-separated list of allowed frontend origins. Add your deployed Netlify
# URL here (e.g. https://your-app.netlify.app) alongside the local dev ports.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Vehicle image uploads ----------
app.upload-dir=${UPLOAD_DIR:uploads/vehicles}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
